<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="653" height="375" viewBox="0 0 653 375" xml:space="preserve" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
<title>Reconstructed screenshot</title>
<desc>Generated by distill-svg (蒸矢). Semantic SVG reconstruction of a screenshot. Text is selectable. Photo/avatar crops may be embedded as image data URIs.</desc>
<rect x="0" y="0" width="653" height="375" fill="#ffffff"/>
<g id="panels">
<rect x="2.0" y="44.0" width="650.0" height="330.0" fill="#ffffff"/>
<rect x="2.0" y="0.0" width="650.0" height="42.0" rx="10.0" fill="#ffffff"/>
</g>
<g id="strokes">
<line x1="0.0" y1="42.0" x2="652.0" y2="42.0" stroke="#d1d9e0" stroke-width="1.0" stroke-linecap="butt"/>
<line x1="34.0" y1="125.0" x2="641.0" y2="125.0" stroke="#dfe5e9" stroke-width="1.0" stroke-linecap="butt"/>
<line x1="1.0" y1="0.0" x2="1.0" y2="374.0" stroke="#d1d9e0" stroke-width="1.0" stroke-linecap="butt"/>
</g>
<g id="images">
<image x="597.0" y="7.0" width="26.0" height="26.0" href="data:image/png;base64," preserveAspectRatio="none"/>
<image x="639.0" y="9.0" width="12.0" height="24.0" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAwAAAAYCAYAAADOMhxqAAAASUlEQVQ4jWNgGHSAEY3PAqX/oPGxamDZsHXXJxAjwNuND0TfuHX3043bd1E0YZiADNZt3sFw+dpNypxEMhj1NDE2DAdPjwJiAADSujJKbijmCwAAAABJRU5ErkJggg==" preserveAspectRatio="none"/>
<image x="7.0" y="35.0" width="82.0" height="8.0" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAFIAAAAICAYAAABqOagKAAAAXklEQVRIiWNgGAWjYBSMglEwCmgMGNH4LAPiiqEJ/iBzQAEJDrz///+z/OsteccwGpjEgD9MxT1CjIyM8MBkuXjzwScQ49Kthww6DAwcDJipdBRgAhZgeL0Dhh1cAAAJ0hZS+qhRyQAAAABJRU5ErkJggg==" preserveAspectRatio="none"/>
<image x="29.0" y="141.0" width="16.0" height="28.0" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAcCAYAAABoMT8aAAAAUklEQVQ4jWNkwAL+///PgcxnZGT8gU0dCLBgE7t06+E7JLk/QMwHpYkyACbOistWZMBEjKJRA0YNGDVg1IBRA4gDuErlPzjYGICRSIPxGjKwAADftQzD9Xz5pwAAAABJRU5ErkJggg==" preserveAspectRatio="none"/>
</g>
<g id="text" font-family='&quot;PingFang SC&quot;,&quot;Noto Sans SC&quot;,&quot;Source Han Sans SC&quot;,&quot;Microsoft YaHei&quot;,sans-serif' style="user-select:text" data-role="text">
<text x="18.00" y="25.00" font-size="13.00" font-weight="500" fill="#202328">README</text>
<text x="102.00" y="26.00" font-size="13.00" font-weight="500" fill="#202328">GPL-3.0 license</text>
<text x="33.00" y="108.00" font-size="29.00" font-weight="600" fill="#202328">Distill-SVG 蒸矢</text>
<text x="54.00" y="160.00" font-size="15.00" font-weight="600" fill="#59636e">Distill png/jpg screenshots to copy-pastable SVG 把截图蒸馏成可编辑的 SVG。</text>
<text x="34.00" y="200.00" font-size="15.00" font-weight="600" fill="#202328">Screenshot - flat-color or wireframe SVG. Panels become rectangles, text stays</text>
<text x="34.00" y="224.00" font-size="15.00" font-weight="600" fill="#202328">real selectable text, icons/emoji are cut out or traced depending on style, and</text>
<text x="34.00" y="248.00" font-size="15.00" font-weight="500" fill="#202328">photos/avatars are embedded as cropped images （or replaced with placeholders in</text>
<text x="34.00" y="272.00" font-size="14.00" font-weight="500" fill="#202328">privacy mode）.</text>
<text x="34.00" y="312.00" font-size="15.00" font-weight="600" fill="#202328">This is semantic reconstruction, not a bitmap trace: the output is a redrawn Ul, not a</text>
<text x="33.00" y="336.00" font-size="15.00" font-weight="600" fill="#202328">compressed copy of the screenshot. Geometry, text and colours are rebuilt; the full-</text>
<text x="34.00" y="360.00" font-size="15.00" font-weight="600" fill="#202328">frame raster is never embedded. Photo/avatar crops can be embedded on demand.</text>
</g>
</svg>
