[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "caption-svg"
version = "0.2.0"
description = "Reconstruct a GUI screenshot as a flat-color or wireframe SVG"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "opencv-python>=4.9",
  "Pillow>=10.0",
]

[project.optional-dependencies]
ocr = ["rapidocr_onnxruntime>=1.3"]

[project.scripts]
caption-svg = "caption_svg.cli:main"

[tool.setuptools.packages.find]
include = ["caption_svg*"]
