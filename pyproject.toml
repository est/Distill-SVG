[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "distill-svg"
version = "1.1"
description = "Distill a GUI screenshot into a flat-color or wireframe SVG"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "opencv-python>=4.9",
  "Pillow>=10.0",
]

[project.optional-dependencies]
ocr = ["rapidocr_onnxruntime>=1.3"]

[project.scripts]
distill-svg = "distill_svg.cli:main"

[tool.setuptools.packages.find]
include = ["distill_svg*"]
