name: macOS DMG

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # macos-15 is an arm64 (M1) runner.  If you move this to an Intel runner,
    # the artifacts will be x86_64; the DMG names include the host arch.
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Toolchain
        run: |
          command -v cmake >/dev/null || brew install cmake
          python3 -m pip install --upgrade pip
          # Only needed for mac/make_icon.py when AppIcon.icns is not cached.
          python3 -m pip install pillow
          swiftc --version
          python3 --version
          uname -m

      # Cache the OpenCV source only.  The venv/build tree is cheap to rebuild
      # and contains absolute paths; keeping it out of the cache is safer.
      - uses: actions/cache@v4
        with:
          path: build/opencv-min/opencv
          key: opencv-src-${{ runner.os }}-${{ runner.arch }}-4.13.0-${{ hashFiles('mac/requirements-core.txt', 'mac/build_opencv_min.sh') }}

      - name: Build full self-contained app
        run: ./mac/build_app.sh

      - name: Build BYO-Python app
        run: |
          BUNDLE_PYTHON=0 ./mac/build_app.sh

      - name: Verify DMGs and checksums
        run: |
          ls -lh dist
          for dmg in dist/*.dmg; do
            hdiutil verify "$dmg"
          done
          cat dist/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: DistillSVG-macos-${{ runner.arch }}
          path: |
            dist/*.dmg
            dist/SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/SHA256SUMS
          generate_release_notes: true
